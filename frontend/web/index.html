<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kairos - red social para estudiantes tecnico-profesionales. Conecta alumnos con empresas y practicas.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kairos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kairos</title>
  <link rel="manifest" href="manifest.json">

  <!-- =====================================================================
       GOOGLE ANALYTICS
       Reemplaza G-XXXXXXXXXX por tu ID de medicion (Google Analytics lo
       entrega al crear el flujo de datos). Es el UNICO valor que debes
       cambiar. Mientras diga G-XXXXXXXXXX el seguimiento queda desactivado
       y la aplicacion funciona igual.
       ===================================================================== -->
  <script>
    var KAIROS_GA_ID = 'G-XDGCXT8NRL';   /* <-- ID de medicion de Google Analytics */

    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

    var KAIROS_GA_ACTIVO = KAIROS_GA_ID.indexOf('XXXX') === -1;

    if (KAIROS_GA_ACTIVO) {
      var gaScript = document.createElement('script');
      gaScript.async = true;
      gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + KAIROS_GA_ID;
      document.head.appendChild(gaScript);

      gtag('js', new Date());
      gtag('config', KAIROS_GA_ID);
    }

    /* Puente que usa la app (Flutter) para registrar cada interaccion.
       Si GA no esta configurado no hace nada y no rompe la aplicacion.
       Para depurar en el navegador: window.KAIROS_DEBUG_ANALYTICS = true */
    window.kairosTrack = function (name, params) {
      try {
        if (KAIROS_GA_ACTIVO) {
          gtag('event', name, params || {});
        }
        if (window.KAIROS_DEBUG_ANALYTICS) {
          console.log('[analytics]', name, params || {});
        }
      } catch (e) { /* nunca interrumpir la app por analitica */ }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
