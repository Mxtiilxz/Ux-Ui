name: Accessibility AA

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility-aa.yml'
  push:
    branches:
      - main
      - accessibility
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility-aa.yml'

permissions:
  contents: read

jobs:
  flutter-accessibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run accessibility regression suite
        run: flutter test

      # kDemoMode es una constante de compilación: con DEMO_MODE=true el
      # compilador elimina las rutas que hablan con el backend real, así que
      # esa build sola no probaría el código que corre en producción.
      - name: Build release web artifact (producción)
        run: flutter build web --release --dart-define=BACKEND_URL=https://example.invalid

      - name: Build release web artifact (demo)
        run: flutter build web --release --dart-define=DEMO_MODE=true
